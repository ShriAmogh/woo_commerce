<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WooChat Widget Tester</title>
    <!-- Use React and Babel from CDN for a standalone test page -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
        .control-panel { max-width: 600px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Chat Widget Styles */
        #woo-chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }
        .chat-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .chat-button:hover { transform: scale(1.05); }
        .chat-button svg { width: 30px; height: 30px; }
        
        .chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            transform-origin: bottom right;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .chat-window.closed {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }
        .chat-header {
            background: #2563eb;
            color: white;
            padding: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-close { background: none; border: none; color: white; cursor: pointer; font-size: 20px; }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.bot { background: white; border: 1px solid #e5e7eb; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message-content { white-space: pre-wrap; }
        
        .chat-input {
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            outline: none;
            font-family: inherit;
        }
        .chat-input input:focus { border-color: #2563eb; }
        .chat-input button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input button:disabled { background: #9ca3af; cursor: not-allowed; }
        
        /* Markdown minimal styling */
        .message.bot a { color: #2563eb; text-decoration: none; font-weight: 500;}
        .message.bot a:hover { text-decoration: underline; }
        .message.bot ul { margin: 8px 0; padding-left: 20px; }
        .message.bot strong { font-weight: 600; color: #111827; }
    </style>
</head>
<body>

    <div class="control-panel">
        <h2>🛠️ Test Environment Control Panel</h2>
        <p>Use this to simulate the WordPress state that the plugin would inject.</p>
        <div style="margin-bottom: 10px;">
            <label>
                <input type="checkbox" id="auth-toggle"> 
                <strong>Simulate Logged In User</strong>
            </label>
        </div>
        <div>
            <small style="color: #6b7280;">Session ID: <span id="session-display"></span></small><br>
            <button onclick="generateNewSession()" style="margin-top: 5px; padding: 4px 8px; font-size: 12px;">Reset Session</button>
        </div>
    </div>

    <!-- The root element where the React widget mounts -->
    <div id="woo-chat-widget"></div>

    <script type="text/babel">
        // Generate a random UUID for the session
        function uuidv4() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Shared state manager for our non-React control panel to communicate with React
        window.sessionState = {
            sessionId: uuidv4(),
            isLoggedIn: false,
            userId: null
        };

        document.getElementById('session-display').innerText = window.sessionState.sessionId;

        document.getElementById('auth-toggle').addEventListener('change', (e) => {
            window.sessionState.isLoggedIn = e.target.checked;
            window.sessionState.userId = e.target.checked ? 123 : null;
            console.log("Auth State Changed to:", window.sessionState.isLoggedIn);
        });

        window.generateNewSession = () => {
            window.sessionState.sessionId = uuidv4();
            document.getElementById('session-display').innerText = window.sessionState.sessionId;
            console.log("New session started.");
            // Trigger a re-render if needed, but normally we just read it on send
        };


        const ChatWidget = () => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([
                { id: 1, role: 'bot', text: 'Hi there! I am your store assistant. How can I help you today?' }
            ]);
            const [input, setInput] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);
            const messagesEndRef = React.useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            React.useEffect(() => {
                scrollToBottom();
            }, [messages]);

            // Simple markdown parser for bold, links, and bullets
            const renderFormattedText = (text) => {
                // Highly basic regex replacing for demo
                let html = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
                    .replace(/^-\s+(.*)/gm, '<li>$1</li>')
                    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                    .replace(/\n/g, '<br/>');
                
                return <div className="message-content" dangerouslySetInnerHTML={{ __html: html }} />;
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading) return;

                const userText = input.trim();
                setInput('');
                setMessages(prev => [...prev, { id: Date.now(), role: 'user', text: userText }]);
                setIsLoading(true);

                try {
                    const response = await fetch('http://localhost:8000/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: userText,
                            session_context: {
                                is_logged_in: window.sessionState.isLoggedIn,
                                session_id: window.sessionState.sessionId,
                                user_id: window.sessionState.userId
                            }
                        })
                    });

                    if (!response.ok) throw new Error('API Error');
                    const data = await response.json();
                    
                    setMessages(prev => [...prev, { id: Date.now(), role: 'bot', text: data.response }]);

                } catch (error) {
                    console.error("Chat error:", error);
                    setMessages(prev => [...prev, { id: Date.now(), role: 'bot', text: "Sorry, I had trouble connecting to the server. Is FastAPI running?" }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div style={{ position: 'relative' }}>
                    
                    <div className={`chat-window ${!isOpen ? 'closed' : ''}`}>
                        <div className="chat-header">
                            <span>🛍️ Store Assistant</span>
                            <button className="chat-close" onClick={() => setIsOpen(false)}>&times;</button>
                        </div>
                        
                        <div className="chat-messages">
                            {messages.map(m => (
                                <div key={m.id} className={`message ${m.role}`}>
                                    {renderFormattedText(m.text)}
                                </div>
                            ))}
                            {isLoading && (
                                <div className="message bot">
                                    <div className="message-content" style={{ opacity: 0.5 }}>Typing...</div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        <form className="chat-input" onSubmit={sendMessage}>
                            <input 
                                type="text" 
                                placeholder="Type a message..." 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                disabled={isLoading}
                            />
                            <button type="submit" disabled={!input.trim() || isLoading}>
                                <svg xmlns="http://www.w3.org/0000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                  <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
                                </svg>
                            </button>
                        </form>
                    </div>

                    {!isOpen && (
                        <button className="chat-button" onClick={() => setIsOpen(true)}>
                            <svg xmlns="http://www.w3.org/0000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                            </svg>
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('woo-chat-widget'));
        root.render(<ChatWidget />);
    </script>
</body>
</html>
